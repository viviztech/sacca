name: sacca

# PHP version
php: '8.4'

# Build steps run once during deployment
build:
  - composer install --no-dev --optimize-autoloader
  - npm ci
  - npm run build
  - php artisan config:cache
  - php artisan route:cache
  - php artisan view:cache
  - php artisan event:cache
  - php artisan storage:link

# Deploy steps run on each new deployment
deploy:
  - php artisan migrate --force

# Web server configuration
web:
  command: null  # uses default PHP-FPM + nginx
  health: /up

# Queue workers
workers:
  - name: notifications
    command: php artisan queue:work redis --queue=notifications --tries=3 --timeout=30 --sleep=3
    replicas: 2

  - name: reports
    command: php artisan queue:work redis --queue=reports --tries=2 --timeout=300 --sleep=5
    replicas: 1

  - name: default
    command: php artisan queue:work redis --queue=default --tries=3 --timeout=60 --sleep=3
    replicas: 1

# Laravel Scheduler (replaces server cron)
scheduler:
  enabled: true
